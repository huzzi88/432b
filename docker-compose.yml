# ═══════════════════════════════════════════════
# KEPLER432B — Docker Compose (for local testing)
# In Dokploy you create services individually
# This file is for local docker-compose up
# ═══════════════════════════════════════════════
version: "3.8"

services:
  # ─── PostgreSQL ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kepler432b-db
    restart: always
    environment:
      POSTGRES_DB: kepler432b
      POSTGRES_USER: kepler432b_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-StrongPassword123!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kepler432b_app -d kepler432b"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ─────────────────────────────
  backend:
    build: ./server
    container_name: kepler432b-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: kepler432b
      DB_USER: kepler432b_app
      DB_PASSWORD: ${DB_PASSWORD:-StrongPassword123!}
      JWT_SECRET: ${JWT_SECRET:-change-this-64-char-random-secret-openssl-rand-hex-64}
      JWT_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 12
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@kepler432b.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123!}
      ADMIN_PIN: ${ADMIN_PIN:-1234}
      ADMIN_PIN1: ${ADMIN_PIN1:-pin1}
      ADMIN_PIN2: ${ADMIN_PIN2:-pin2}
      ADMIN_PIN3: ${ADMIN_PIN3:-pin3}
    ports:
      - "5000:5000"

  # ─── Frontend ────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kepler432b-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
